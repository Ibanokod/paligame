<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paligame : trois styles</title>
<style>
  :root { --bg: #0b1220; --surface: #141c2e; --text: #e9eef7; --muted: #9aa7bd; --water: #3ec1f3; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, 'Segoe UI', sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 32px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 40px 0 12px; }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  figure { margin: 0; background: var(--surface); border-radius: 16px; padding: 12px; }
  figcaption { font-weight: 700; margin-bottom: 8px; }
  figcaption span { color: var(--muted); font-weight: 500; font-size: 14px; }
  img { display: block; width: 100%; border-radius: 10px; }
  @media (max-width: 700px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Paligame : les trois styles de carte</h1>
  <p class="lead">Mêmes écrans, même collection de démonstration, seul le style des cartes change. Captures produites par <code>node scripts/capture.mjs</code> (à relancer avant d'ouvrir cette page si les images manquent). Fichier à ouvrir depuis <code>captures/</code>.</p>
  <div id="rows"></div>
</main>
<script>
  const styles = [['classique', 'Classique', 'carte de jeu'], ['memo', 'Mémo', 'fiche de révision'], ['galerie', 'Galerie', 'illustration pleine carte']]
  const screens = [
    ['04-apercu-galerie.png', 'Aperçu dans le style choisi', (s) => ({ classique: '02-apercu-classique.png', memo: '03-apercu-memo.png', galerie: '04-apercu-galerie.png' })[s]],
    ['22-booster-retournee.png', 'Ouverture d\'un booster'],
    ['23-booster-bilan.png', 'Bilan du booster'],
    ['31-rare-revelee.png', 'Carte exceptionnelle, version brillante'],
    ['12-fiche-haut.png', 'Fiche de carte'],
    ['11-pharmacodex.png', 'Pharmacodex'],
    ['10-accueil.png', 'Accueil'],
    ['16-reglages-styles.png', 'Réglages : choix du style'],
  ]
  const root = document.getElementById('rows')
  for (const [file, title, pick] of screens) {
    const h = document.createElement('h2'); h.textContent = title; root.append(h)
    const row = document.createElement('div'); row.className = 'row'
    for (const [id, name, hint] of styles) {
      const fig = document.createElement('figure')
      fig.innerHTML = `<figcaption>${name} <span>· ${hint}</span></figcaption><img loading="lazy" alt="${title}, style ${name}" src="${id}/${pick ? pick(id) : file}">`
      row.append(fig)
    }
    root.append(row)
  }
</script>
</body>
</html>
